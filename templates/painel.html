<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Diário de Triatlo - Treinamento</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; text-align: center; }
        .btn { padding: 15px 20px; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-cooper { background-color: #e74c3c; } 
        .btn-rotina { background-color: #2ecc71; } 
        .upload-area { margin: 20px 0; padding: 15px; border: 2px dashed #ccc; background-color: #fafafa; border-radius: 5px; }
        .flash-msg { padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; }
        .flash-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .regras-cooper { background-color: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; border: 1px solid #ffeeba; text-align: left; font-size: 14px; margin-bottom: 20px;}
    </style>
</head>
<body>
    
    <a href="/logout" style="float: right; color: red; text-decoration: none; font-weight: bold;">Sair (Logout)</a>

    <div class="card">
        <h2>Seu Painel de Treinamento</h2>
